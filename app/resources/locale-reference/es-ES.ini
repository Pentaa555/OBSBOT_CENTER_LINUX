Beauty.BgGreenHelp="Cuando haya un fondo verde/azul, se recomienda habilitar esta opción para garantizar el mejor efecto."
Beauty.BgGreenAdvancedTip="1. Similitud\nCuanto mayor sea la similitud, más fuerte será el efecto de chroma key. Aumente si el fondo verde no se elimina por completo. Disminuya si el primer plano se elimina por error.\n\n2. Suavidad\nMenor suavidad hace que la transición entre primer plano y fondo sea más notable. Mayor suavidad resulta en una transición más suave.\n\n3. Eliminación de Bordes\nUna mayor intensidad elimina más de los bordes. Aumente si ve bordes negros, derrames verdes o contornos dentados.\n\n4. Ratio Gris\nAumente este valor si algunas áreas muestran derrame verde o bordes verdes alrededor del sujeto.\n\n5. Eliminación de Sombras\nAumente este valor cuando las áreas sombreadas en el green screen causen un mal rendimiento del keying."
