Beauty.BgGreenHelp="When a green/blue screen is present in the background, it is recommended to enable this option to ensure the best effect."
Beauty.BgGreenAdvancedTip="1. Similarity\nThe higher the similarity, the stronger the green-screen keying effect. Increase it if the green background is not fully removed. Decrease it if the foreground is being mistakenly keyed out.\n\n2. Smoothness\nLower smoothness makes the transition between the foreground and background more noticeable. Higher smoothness results in a smoother transition.\n\n3. Edge Removal\nA higher edge removal intensity removes more from the edges. Increase it if you see black edges, green spill, or jagged outlines on subjects or objects.\n\n4. Gray Ratio\nIncrease this value if some areas show green spill or green edges around the subject.\n\n5. Shadow Removal\nIncrease this value when shadowed areas on the green screen cause poor keying performance."
